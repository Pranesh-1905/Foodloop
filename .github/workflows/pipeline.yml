name: CI Pipeline

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Create a fake python file
        run: |
          echo "def calculate_total(a, b):" > math_utils.py
          echo "    return a - b  # BUG: Should be addition!" >> math_utils.py
          
      - name: Run Intentionally Failing Test
        run: |
          python -c "
          from math_utils import calculate_total
          assert calculate_total(2, 2) == 4, 'Math test failed! Expected 4.'
          "
